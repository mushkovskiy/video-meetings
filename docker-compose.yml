# Переменные ${...} ниже подставляются из apps/backend/.env (см. apps/backend/.env.example).
# У top-level env_file нет эффекта на интерполяцию, поэтому запускать нужно так:
#   docker compose --env-file apps/backend/.env up -d

services:
  mongo:
    image: mongo:7
    container_name: video-meetings-mongo
    restart: unless-stopped
    ports:
      - '${DB_MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_MONGO_NAME}
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:16
    container_name: video-meetings-postgres
    restart: unless-stopped
    ports:
      - '${DB_POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRES_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  mongo-data:
  postgres-data:
